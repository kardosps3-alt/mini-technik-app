<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>MiNi Technik – výkazy</title><style>:root{font-family:system-ui,Arial;color:#171717;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}header{background:#171717;color:white;padding:16px}header strong{color:#ff8500;font-size:23px}main{max-width:800px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:18px;margin:0 0 14px;box-shadow:0 2px 12px #0001}input,button{font:inherit;border-radius:9px;padding:10px}input{border:1px solid #ccc;max-width:100%;width:100%}button{border:0;background:#ff8500;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#eee}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}.hidden{display:none!important}.day{display:grid;grid-template-columns:minmax(90px,1fr) 65px 65px;gap:7px;align-items:center;margin:8px 0}.day input{text-align:center;padding:8px 2px}.muted{color:#666;font-size:13px}.error{color:#a30000}.ok{color:#136b38}.entry{border:1px solid #ddd;padding:12px;border-radius:10px;margin:9px 0}.entry button{margin:3px}.tabs{display:flex;gap:7px}.tabs button{flex:1}.tabs .active{background:#171717;color:#fff}@media print{header,.noprint,#auth,#editor,#list,#admin{display:none!important}#print{display:block!important}body{background:white}.card{box-shadow:none}}</style></head><body><header><strong>⚙ MiNi Technik</strong><div style="font-size:12px">Evidencia pracovného času</div></header><main><div id="status" class="muted">Načítavam aplikáciu…</div><section id="auth" class="card hidden"><h2>Prihlásenie</h2><label>E-mail</label><input id="email" type="email" autocomplete="email"><label>Heslo</label><input id="password" type="password" autocomplete="current-password"><label>Meno a priezvisko (pri registrácii)</label><input id="fullname" autocomplete="name"><div class="row" style="margin-top:14px"><button id="login">Prihlásiť</button><button id="register" class="secondary">Registrovať sa</button></div><p class="muted">Nové účty musí schváliť správca.</p></section><section id="app" class="hidden"><div class="card"><div class="row"><b id="userlabel"></b><button id="logout" class="secondary">Odhlásiť</button></div></div><section id="pending" class="card hidden"><h2>Čaká sa na schválenie</h2><p>Správca musí najskôr schváliť váš účet.</p></section><div id="approved" class="hidden"><div class="tabs card"><button id="tabmine" class="active">Moje výkazy</button><button id="taball" class="hidden">Všetky výkazy</button><button id="tabusers" class="hidden">Pracovníci</button></div><section id="editor" class="card"><h2>Týždenný výkaz</h2><label>Pondelok v týždni</label><input id="week" type="date"><label>Miesto / projekt</label><input id="project" placeholder="Názov zákazky"><div class="day" style="font-size:12px;font-weight:700"><span>Deň</span><span>Práca</span><span>Cesta</span></div><div id="days"></div><p><b id="sum">Spolu: 0 h práce, 0 h cesty</b></p><div class="row"><button id="save">Uložiť výkaz</button><button id="reset" class="secondary">Nový výkaz</button></div></section><section id="list" class="card"><h2 id="listtitle">Moje výkazy</h2><div id="entries"></div></section><section id="admin" class="card hidden"><h2>Schvaľovanie pracovníkov</h2><div id="users"></div></section></div></section><section id="print" class="card hidden"></section></main><script>
'use strict';
const SUPABASE_PROJECT='jmirxaqvsiabmexznmxx';
const SUPABASE_URL='https://' + SUPABASE_PROJECT + '.supabase.co';
const SUPABASE_KEY='sb_publishable_XlwNxKly9NG9dYxylSHRjg_PfprPI8v';
const $=id=>document.getElementById(id), show=(id,on)=>$(id).classList.toggle('hidden',!on), msg=(s,bad=false)=>{$('status').textContent=s;$('status').className=bad?'error':'muted'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,user,profile,editing=null,view='mine';
const monday=d=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10)};
const plus=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const labels=['Po','Ut','St','Št','Pi','So','Ne'];
function buildDays(data=[]){$('days').innerHTML=labels.map((name,i)=>`<div class="day"><span>${name} <small id="date${i}"></small></span><input aria-label="Práca ${name}" id="w${i}" type="number" min="0" max="24" step="0.5" value="${Number(data[i]?.work_hours||0)}"><input aria-label="Cesta ${name}" id="t${i}" type="number" min="0" max="24" step="0.5" value="${Number(data[i]?.travel_hours||0)}"></div>`).join('');for(let i=0;i<7;i++){['w','t'].forEach(k=>$(k+i).addEventListener('input',sum))}dates();sum()}
function dates(){if(!$('week').value)return;for(let i=0;i<7;i++)$('date'+i).textContent=plus(monday($('week').value),i).slice(5)}
function hours(){return labels.map((_,i)=>({day_date:plus(monday($('week').value),i),work_hours:Number($('w'+i).value||0),travel_hours:Number($('t'+i).value||0)}))}
function sum(){const a=hours();$('sum').textContent=`Spolu: ${a.reduce((s,d)=>s+d.work_hours,0)} h práce, ${a.reduce((s,d)=>s+d.travel_hours,0)} h cesty`}
function reset(){editing=null;$('project').value='';$('week').value=monday(new Date().toISOString().slice(0,10));buildDays()}
async function loadProfile(){const r=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(r.error)throw r.error;profile=r.data;return profile}
async function refresh(){const s=await db.auth.getUser();user=s.data.user;show('auth',!user);show('app',!!user);if(!user){msg('Prihláste sa.');return}await loadProfile();$('userlabel').textContent=profile?.full_name||user.email;let approved=profile?.approved===true||profile?.status==='approved';show('pending',!approved);show('approved',approved);let admin=profile?.role==='admin';show('taball',admin);show('tabusers',admin);if(approved)await loadEntries();msg(approved?'Pripojené.':'Účet čaká na schválenie.')}
async function login(){try{msg('Prihlasujem…');let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;await refresh()}catch(e){msg(e.message,true)}}
async function register(){try{if(!$('fullname').value.trim())throw Error('Zadajte meno a priezvisko.');let r=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{full_name:$('fullname').value.trim()}}});if(r.error)throw r.error;msg('Registrácia odoslaná. Potvrďte e-mail, ak je to potrebné, a počkajte na schválenie.')}catch(e){msg(e.message,true)}}
async function save(){try{let a=hours();if(a.some(d=>!Number.isFinite(d.work_hours)||!Number.isFinite(d.travel_hours)||d.work_hours<0||d.travel_hours<0||d.work_hours>24||d.travel_hours>24))throw Error('Hodiny musia byť medzi 0 a 24.');let payload={user_id:user.id,week_start:monday($('week').value),project:$('project').value.trim(),days:a};if(editing)payload.id=editing;let r=await db.from('timesheets').upsert(payload,{onConflict:'id'});if(r.error)throw r.error;reset();await loadEntries();msg('Výkaz bol uložený.')}catch(e){msg('Uloženie zlyhalo: '+e.message,true)}}
let records=[];
async function loadEntries(){try{let q=db.from('timesheets').select('*').order('week_start',{ascending:false});if(view==='mine'||profile?.role!=='admin')q=q.eq('user_id',user.id);let r=await q;if(r.error)throw r.error;records=r.data||[];$('entries').innerHTML=records.length?'':'Zatiaľ žiadne výkazy.';records.forEach((v,i)=>{let d=document.createElement('div');d.className='entry';let days=Array.isArray(v.days)?v.days:[];let w=days.reduce((s,x)=>s+Number(x.work_hours||0),0),t=days.reduce((s,x)=>s+Number(x.travel_hours||0),0);d.innerHTML=`<b>${esc(v.week_start)} – ${esc(v.project)}</b><p>${w} h práce, ${t} h cesty</p><button data-act="pdf" data-i="${i}">PDF / Tlač</button> ${v.user_id===user.id?`<button class="secondary" data-act="edit" data-i="${i}">Upraviť</button>`:''}`;$('entries').append(d)});$('entries').querySelectorAll('button').forEach(b=>b.onclick=()=>{let v=records[Number(b.dataset.i)];if(b.dataset.act==='edit'){editing=v.id;$('week').value=v.week_start;$('project').value=v.project||'';buildDays(v.days||[]);window.scrollTo(0,0)}else printReport(v)});msg('Výkazy načítané.')}catch(e){msg('Nepodarilo sa načítať výkazy: '+e.message,true)}}
function printReport(v){let a=Array.isArray(v.days)?v.days:[];$('print').innerHTML=`<h1>MiNi Technik – týždenný výkaz</h1><p><b>Týždeň:</b> ${esc(v.week_start)} | <b>Projekt:</b> ${esc(v.project)}</p><p><b>ID pracovníka:</b> ${esc(v.user_id)}</p><table style="width:100%;border-collapse:collapse"><tr><th>Deň</th><th>Práca (h)</th><th>Cesta (h)</th></tr>${a.map((d,i)=>`<tr><td>${labels[i]||''} ${esc(d.day_date)}</td><td>${Number(d.work_hours||0)}</td><td>${Number(d.travel_hours||0)}</td></tr>`).join('')}</table><h3>Práca: ${a.reduce((s,d)=>s+Number(d.work_hours||0),0)} h | Cesta: ${a.reduce((s,d)=>s+Number(d.travel_hours||0),0)} h</h3>`;show('print',true);window.print();setTimeout(()=>show('print',false),500)}
async function loadUsers(){try{let r=await db.from('profiles').select('*').order('full_name');if(r.error)throw r.error;$('users').innerHTML='';r.data.forEach(p=>{let d=document.createElement('div');d.className='entry';d.innerHTML=`<b>${esc(p.full_name||p.id)}</b><p>${p.approved===true||p.status==='approved'?'Schválený':'Čaká na schválenie'}</p>`;let b=document.createElement('button');b.textContent='Schváliť';b.disabled=p.approved===true||p.status==='approved';b.onclick=async()=>{let z=await db.from('profiles').update({approved:true}).eq('id',p.id);if(z.error)msg(z.error.message,true);else loadUsers()};d.append(b);$('users').append(d)})}catch(e){msg(e.message,true)}}
function tab(name){view=name;show('editor',name==='mine');show('list',name!=='users');show('admin',name==='users');$('tabmine').classList.toggle('active',name==='mine');$('taball').classList.toggle('active',name==='all');$('tabusers').classList.toggle('active',name==='users');if(name==='users')loadUsers();else{ $('listtitle').textContent=name==='all'?'Všetky výkazy':'Moje výkazy';loadEntries()}}
function loadSupabase(){
 return new Promise((resolve,reject)=>{
  const urls=[
   'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
   'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'
  ];
  let i=0;
  function next(){
   if(window.supabase && typeof window.supabase.createClient==='function')return resolve();
   if(i>=urls.length)return reject(new Error('Knižnicu Supabase sa nepodarilo načítať. Skontrolujte internet.'));
   const script=document.createElement('script');
   script.src=urls[i++];script.onload=next;script.onerror=next;
   document.head.appendChild(script);
  }
  next();
 });
}
async function init(){
 try{
  reset();
  $('week').addEventListener('change',()=>{dates();sum()});
  $('login').onclick=()=>{if(!db)return msg('Databáza nie je pripojená.',true);login()};
  $('register').onclick=()=>{if(!db)return msg('Databáza nie je pripojená.',true);register()};
  $('save').onclick=save;$('reset').onclick=reset;
  $('logout').onclick=async()=>{if(db){await db.auth.signOut();await refresh()}};
  $('tabmine').onclick=()=>tab('mine');$('taball').onclick=()=>tab('all');$('tabusers').onclick=()=>tab('users');
  show('auth',true);msg('Pripájam sa k databáze…');
  await loadSupabase();
  const url=new URL(SUPABASE_URL);
  if(url.protocol!=='https:' || !url.hostname.endsWith('.supabase.co'))throw Error('Nesprávna adresa databázy: '+SUPABASE_URL);
  db=window.supabase.createClient(url.href.replace(/\/$/,''),SUPABASE_KEY);
  if(!db || !db.auth)throw Error('Klient Supabase sa nevytvoril správne.');
  await refresh();
 }catch(e){show('auth',true);msg('Chyba pripojenia: '+(e?.message||String(e)),true);console.error(e)}
}
init();
</script></body></html>
