<style>
:root{font-family:system-ui,Arial;color:#171717;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}header{background:#171717;color:white;padding:16px}header strong{color:#ff8500;font-size:23px}main{max-width:800px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:18px;margin:0 0 14px;box-shadow:0 2px 12px #0001}input,button{font:inherit;border-radius:9px;padding:10px}input{border:1px solid #ccc;max-width:100%;width:100%}button{border:0;background:#ff8500;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#eee}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}.hidden{display:none!important}.day{display:grid;grid-template-columns:minmax(90px,1fr) 65px 65px;gap:7px;align-items:center;margin:8px 0}.day input{text-align:center;padding:8px 2px}.muted{color:#666;font-size:13px}.error{color:#a30000}.entry{border:1px solid #ddd;padding:12px;border-radius:10px;margin:9px 0}.entry button{margin:3px}.tabs{display:flex;gap:7px}.tabs button{flex:1}.tabs .active{background:#171717;color:#fff}#print{display:none}.report-head{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #ff8500;padding-bottom:14px;margin-bottom:25px}.report-logo{max-width:180px;max-height:75px;object-fit:contain}.report-title{font-size:22px;margin:0}.report-meta{line-height:1.9;margin-bottom:24px}.report-table{border-collapse:collapse;width:100%;font-size:14px}.report-table th,.report-table td{border:1px solid #aaa;padding:11px;text-align:center}.report-table th{background:#eee}.report-table td:first-child{text-align:left}.report-table tfoot{font-weight:700;background:#f5f5f5}.report-footer{margin-top:45px;display:flex;justify-content:space-between;gap:20px;font-size:12px;color:#555}

</style></head><body><header><strong>⚙ MiNi Technik</strong><div style="font-size:12px">Evidencia pracovného času</div></header><main><div id="status" class="muted">Načítavam aplikáciu…</div><section id="auth" class="card hidden"><h2>Prihlásenie</h2><label>E-mail</label><input id="email" type="email" autocomplete="email"><label>Heslo</label><input id="password" type="password" autocomplete="current-password"><label>Meno a priezvisko (pri registrácii)</label><input id="fullname" autocomplete="name"><div class="row" style="margin-top:14px"><button id="login">Prihlásiť</button><button id="register" class="secondary">Registrovať sa</button></div><p class="muted">Nové účty musí schváliť správca.</p></section><section id="app" class="hidden"><div class="card"><div class="row"><b id="userlabel"></b><button id="logout" class="secondary">Odhlásiť</button></div></div><section id="pending" class="card hidden"><h2>Čaká sa na schválenie</h2><p>Správca musí najskôr schváliť váš účet.</p></section><div id="approved" class="hidden"><div class="tabs card"><button id="tabmine" class="active">Moje výkazy</button><button id="taball" class="hidden">Všetky výkazy</button><button id="tabusers" class="hidden">Pracovníci</button></div><section id="editor" class="card"><h2>Týždenný výkaz</h2><label>Pondelok v týždni</label><input id="week" type="date"><label>Miesto / projekt</label><input id="project" placeholder="Názov zákazky"><div class="day" style="font-size:12px;font-weight:700"><span>Deň</span><span>Práca</span><span>Cesta</span></div><div id="days"></div><p><b id="sum">Spolu: 0 h práce, 0 h cesty</b></p><div class="row"><button id="save">Uložiť výkaz</button><button id="reset" class="secondary">Nový výkaz</button></div></section><section id="list" class="card"><h2 id="listtitle">Moje výkazy</h2><div id="entries"></div></section><section id="admin" class="card hidden"><h2>Schvaľovanie pracovníkov</h2><div id="users"></div></section></div></section><section id="detail" class="card hidden"><div class="row"><h2 style="margin:0">Detail výkazu</h2><button id="closedetail" class="secondary">Zavrieť</button></div><div id="detailbody"></div><div class="row" style="margin-top:15px"><button id="detailpdf">PDF / Tlač</button><button id="detailedit" class="secondary">Upraviť výkaz</button></div></section><section id="print" class="card hidden"></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const SUPABASE_URL='https://jmirxaqvsiabmexznmxx.supabase.co',KEY='sb_publishable_XlwNxKly9NG9dYxylSHRjg_PfprPI8v';
const $=id=>document.getElementById(id),show=(id,on)=>$(id).classList.toggle('hidden',!on),msg=(s,bad=false)=>{$('status').textContent=s;$('status').className=bad?'error':'muted'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,user,profile,editing=null,view='mine',records=[];
const cols=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'],labels=['Po','Ut','St','Št','Pi','So','Ne'];
const plus=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const monday=d=>{let x=new Date(d+'T12:00:00');return plus(d,-((x.getDay()+6)%7))};
const toDays=v=>cols.map((c,i)=>({day_date:plus(v.week_start,i),work_hours:Number(v[c]||0),travel_hours:Number(v['travel_'+c]||0)}));
function buildDays(data=[]){$('days').innerHTML=labels.map((name,i)=>`<div class="day"><span>${name} <small id="date${i}"></small></span><input aria-label="Práca ${name}" id="w${i}" type="number" min="0" max="99" step="1" value="${Number(data[i]?.work_hours||0)}"><input aria-label="Cesta ${name}" id="t${i}" type="number" min="0" max="99" step="1" value="${Number(data[i]?.travel_hours||0)}"></div>`).join('');for(let i=0;i<7;i++)for(const k of ['w','t'])$(k+i).addEventListener('input',sum);dates();sum()}
function dates(){if(!$('week').value)return;for(let i=0;i<7;i++)$('date'+i).textContent=plus(monday($('week').value),i).slice(5)}
function hours(){return labels.map((_,i)=>({day_date:plus(monday($('week').value),i),work_hours:Number($('w'+i).value||0),travel_hours:Number($('t'+i).value||0)}))}
function sum(){const a=hours();$('sum').textContent=`Spolu: ${a.reduce((s,d)=>s+d.work_hours,0)} h práce, ${a.reduce((s,d)=>s+d.travel_hours,0)} h cesty`}
function reset(){editing=null;$('project').value='';$('week').value=monday(new Date().toLocaleDateString('en-CA'));buildDays()}
async function loadProfile(){const r=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(r.error)throw r.error;profile=r.data;return profile}
async function refresh(){const s=await db.auth.getUser();user=s.data.user;show('auth',!user);show('app',!!user);if(!user){msg('Prihláste sa.');return}await loadProfile();$('userlabel').textContent=profile?.full_name||user.email;let approved=profile?.approved===true||profile?.status==='approved';show('pending',!approved);show('approved',approved);let admin=profile?.role==='admin';show('taball',admin);show('tabusers',admin);if(approved)await loadEntries();msg(approved?'Pripojené.':'Účet čaká na schválenie.')}
async function login(){try{msg('Prihlasujem…');let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;await refresh()}catch(e){msg(e.message,true)}}
async function register(){try{if(!$('fullname').value.trim())throw Error('Zadajte meno a priezvisko.');let r=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{full_name:$('fullname').value.trim()}}});if(r.error)throw r.error;msg('Registrácia odoslaná. Potvrďte e-mail, ak je to potrebné, a počkajte na schválenie.')}catch(e){msg(e.message,true)}}
async function save(){try{if(!$('week').value)throw Error('Vyberte týždeň.');let a=hours();if(a.some(d=>!Number.isInteger(d.work_hours)||!Number.isInteger(d.travel_hours)||d.work_hours<0||d.travel_hours<0||d.work_hours>99||d.travel_hours>99))throw Error('Hodiny musia byť celé čísla od 0 do 99.');let payload={worker_id:user.id,week_start:monday($('week').value),job_name:$('project').value.trim()};a.forEach((d,i)=>{payload[cols[i]]=d.work_hours;payload['travel_'+cols[i]]=d.travel_hours});if(editing)payload.id=editing;let r=await db.from('timesheets').upsert(payload,{onConflict:'id'});if(r.error)throw r.error;reset();await loadEntries();msg('Výkaz bol uložený.')}catch(e){msg('Uloženie zlyhalo: '+e.message,true)}}
const workerName=v=>v.worker_name||((v.worker_id===user?.id)?(profile?.full_name||user?.email):null)||'Meno nie je dostupné';
function editReport(v){editing=v.id;$('week').value=v.week_start;$('project').value=v.job_name||'';buildDays(toDays(v));show('detail',false);tab('mine');window.scrollTo(0,0)}
async function loadEntries(){try{let q=db.from('timesheets').select('*').order('week_start',{ascending:false});if(view==='mine'||profile?.role!=='admin')q=q.eq('worker_id',user.id);let r=await q;if(r.error)throw r.error;records=r.data||[];const ids=[...new Set(records.map(v=>v.worker_id).filter(Boolean))];if(ids.length){const names=await db.from('profiles').select('id,full_name').in('id',ids);if(!names.error){const map=new Map((names.data||[]).map(p=>[p.id,p.full_name]));records.forEach(v=>v.worker_name=map.get(v.worker_id)||null)}else console.warn('Mená pracovníkov nie sú dostupné:',names.error.message)}$('entries').innerHTML=records.length?'':'Zatiaľ žiadne výkazy.';records.forEach((v,i)=>{let d=document.createElement('div');d.className='entry';let a=toDays(v),w=a.reduce((s,x)=>s+x.work_hours,0),t=a.reduce((s,x)=>s+x.travel_hours,0);d.innerHTML=`<b>${esc(v.week_start)} – ${esc(v.job_name)}</b><p><b>Pracovník:</b> ${esc(workerName(v))}</p><p>${w} h práce, ${t} h cesty</p><button data-act="detail" data-i="${i}">Zobraziť detail</button> <button class="secondary" data-act="pdf" data-i="${i}">PDF / Tlač</button> ${v.worker_id===user.id?`<button class="secondary" data-act="edit" data-i="${i}">Upraviť</button>`:''}`;$('entries').append(d)});$('entries').querySelectorAll('button').forEach(b=>b.onclick=()=>{let v=records[Number(b.dataset.i)];if(b.dataset.act==='detail')showDetail(v);else if(b.dataset.act==='edit')editReport(v);else printReport(v)});msg('Výkazy načítané.')}catch(e){msg('Nepodarilo sa načítať výkazy: '+e.message,true)}}
function showDetail(v){const a=toDays(v),work=a.reduce((n,d)=>n+d.work_hours,0),travel=a.reduce((n,d)=>n+d.travel_hours,0);$('detailbody').innerHTML=`<p><b>Pracovník:</b> ${esc(workerName(v))}</p><p><b>Týždeň:</b> ${esc(v.week_start)}</p><p><b>Projekt:</b> ${esc(v.job_name||'—')}</p><p><b>Firma:</b> ${esc(v.company_name||'—')}</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;text-align:left"><thead><tr><th>Deň</th><th>Práca</th><th>Cesta</th></tr></thead><tbody>${a.map((d,i)=>`<tr><td style="padding:9px;border-bottom:1px solid #eee">${labels[i]} ${esc(d.day_date)}</td><td>${d.work_hours} h</td><td>${d.travel_hours} h</td></tr>`).join('')}</tbody></table></div><h3>Spolu: ${work} h práce, ${travel} h cesty</h3>`;$('detailpdf').onclick=()=>printReport(v);$('detailedit').style.display=v.worker_id===user.id?'':'none';$('detailedit').onclick=()=>editReport(v);show('detail',true);$('detail').scrollIntoView({behavior:'smooth',block:'start'})}
